# Render.com Blueprint — backup deployment config for LeadForge AI
# Usage: In Render dashboard, click "New → Blueprint" and point at this repo.
# Render will provision all services below. Set secret env vars in the dashboard.

services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: leadforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadforge-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in dashboard
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: noreply@leadforge.ai
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL after deploy
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: AI_MAX_TOKENS_PER_CALL
        value: "4096"
      - key: AI_MONTHLY_LIMIT_STARTER
        value: "500"
      - key: AI_MONTHLY_LIMIT_GROWTH
        value: "5000"
      - key: AI_MONTHLY_LIMIT_ENTERPRISE
        value: "50000"

  # ---------- Redis (free tier) ----------
  - type: redis
    name: leadforge-redis
    plan: free
    ipAllowList: []          # only allow internal Render connections
    maxmemoryPolicy: allkeys-lru

# ---------- Postgres (free tier) ----------
databases:
  - name: leadforge-db
    plan: free
    databaseName: leadforge
    user: leadforge
